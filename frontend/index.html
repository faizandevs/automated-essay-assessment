<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Essay Evaluation Demo</title>
    <style>
      body {
        font-family: Arial;
        max-width: 600px;
        margin: 40px auto;
      }

      textarea {
        width: 100%;
        height: 120px;
        margin-bottom: 10px;
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
      }

      #result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h2>Test Essay Evaluation API</h2>

    <label>Question</label>
    <textarea id="question"></textarea>

    <label>Answer</label>
    <textarea id="answer"></textarea>

    <button onclick="evaluateEssay()">Evaluate</button>

    <div id="result"></div>

    <script>
      async function evaluateEssay() {
        const question = document.getElementById("question").value;
        const answer = document.getElementById("answer").value;

        const payload = {
          content: `dummy$${question}$${answer}`,
        };

        const response = await fetch(
          "https://automated-essay-assessment-5k2f.onrender.com/evaluate",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          },
        );

        const data = await response.json();

        document.getElementById("result").innerText =
          "Score: " + data.mark + "/100";
      }
    </script>
  </body>
</html>
